name: Build Sonora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Sonora debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK to Sonora.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Sonora.apk

      - name: Upload Sonora APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-debug-APK
          path: app/build/outputs/apk/debug/Sonora.apk
          if-no-files-found: error
          retention-days: 14
